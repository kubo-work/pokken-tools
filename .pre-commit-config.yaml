# コミット前にローカルでセキュリティスキャンを走らせる pre-commit フック定義。
#
# 前提: pre-commit 本体のインストールが必要（リポジトリ依存ではなくホストに入れる）。
#   brew install pre-commit
# 初回のみフックを有効化:
#   pre-commit install
# ESLint フックはリポジトリの node_modules を使うため、事前に bun install が必要
# （worktree で作業する場合はその worktree でも実行しておく）。
#
# 各フックのバージョン(rev)はここで固定する。更新は手動で:
#   pre-commit autoupdate
# ※ グローバル CLAUDE.md のルールに従い、リリースから3日以上経った版だけに上げること。
repos:
  # シークレット（APIキー・トークン等）のハードコード検出。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # 危険なコーディングパターンの静的解析。
  # --config auto は誤検知が多くルールが毎回リモート取得で非決定的なため、
  # pokken のスタック(TS/JS/React/Next.js)に絞って明示指定する。
  - repo: https://github.com/semgrep/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        args:
          - "--config=p/typescript"
          - "--config=p/javascript"
          - "--config=p/react"
          - "--config=p/secrets"
          # Next.js 固有ルールも見たい場合は次の行を有効化:
          # - "--config=p/nextjs"
          - "--error"               # 検出があれば exit code 1（コミットをブロック）
          - "--skip-unknown-extensions"

  # フックと React Compiler の規則の検査（設定は eslint.config.js）。
  # コミット対象の TS/TSX だけを検査し、CI と同じく警告も失敗扱いにする。
  # --no-warn-ignored: ignores 対象のファイルを名指しで渡したときの警告を出さない
  # （--max-warnings 0 と組み合わせると、無視しただけのファイルで失敗してしまうため）。
  - repo: local
    hooks:
      - id: eslint
        name: eslint (react-hooks)
        entry: ./node_modules/.bin/eslint --max-warnings 0 --no-warn-ignored
        language: system
        files: \.(ts|tsx)$
        exclude: \.d\.ts$

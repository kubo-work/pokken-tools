name = "app"
main = "./workers/app.ts"
compatibility_date = "2026-05-27"
# nodejs_compat: getEnv() が使う node:async_hooks（AsyncLocalStorage）に必要。
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = true

# 静的アセット（クライアントビルド成果物）。@cloudflare/vite-plugin が
# `react-router build` の出力（build/client）を配信する。
[assets]
directory = "./build/client"
binding = "ASSETS"
# react-router.config.ts の prerender が出す disclaimer/index.html を、末尾スラッシュ無しの
# /disclaimer のまま 200 で返す。既定の auto-trailing-slash では /disclaimer/ へ 307 され、
# サイト内リンク（SiteFooter の to="/disclaimer"）が毎回 1 往復増える。
html_handling = "drop-trailing-slash"

# `wrangler kv namespace create FRAME_DATA_KV` で取得した実 ID。
[[kv_namespaces]]
binding = "FRAME_DATA_KV"
id = "f89083c92a804b42a3f86c00458dcb4f"

# `wrangler d1 create pokken-db` で取得した実 ID。
[[d1_databases]]
binding = "DB"
database_name = "pokken-db"
database_id = "bdaddb40-8e75-4459-b943-a25512f91dd3"
migrations_dir = "migrations"
